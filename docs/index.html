<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Germano Pansini — Robotics & Computer Vision</title>
    <meta name="description" content="Robotics and Computer Vision Engineer focused on perception, embedded AI, and simulation-driven development.">

    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        (function() {
            try {
                var saved = localStorage.getItem('theme');
                var theme = saved === 'dark' || saved === 'light' ? saved : 'light';
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>
</head>

<body class="bg-global-bg text-global-text antialiased">

<header id="main-header" class="group">
    <div class="header-grid">

        <!-- Logo -->
        <a href="#" class="group header-logo flex items-center">
            <svg viewBox="0 0 100 100"
                 xmlns="http://www.w3.org/2000/svg"
                 class="me-3 h-10 w-10 sm:h-12 sm:w-12"
                 aria-hidden="true">

                <rect x="0" y="0"
                      width="100" height="100"
                      rx="18"
                      fill="currentColor"
                      opacity="0.15" />

                <text x="50" y="62"
                      text-anchor="middle"
                      font-family="JetBrains Mono, monospace"
                      font-size="42"
                      font-weight="600"
                      fill="currentColor"
                      letter-spacing="-2">
                    GP
                </text>
            </svg>
        </a>

        <!-- Title -->
        <div class="header-title">
            <span class="text-xl font-bold sm:text-2xl">Germano Pansini</span>
        </div>

        <!-- Navigation -->
        <nav class="mobile-nav-menu header-nav sm:flex sm:flex-row sm:items-center" id="navigation-menu">
            <a href="#about">About</a>
            <a href="#publications">Publications</a>
            <a href="#resume">Résumé</a>
        </nav>

        <!-- Controls -->
        <div class="header-controls flex items-center gap-3">

            <!-- Theme Toggle -->
            <button id="theme-toggle"
                class="flex h-7 w-7 items-center justify-center rounded-md border border-accent-2/20 bg-accent-2/10 p-1 transition-colors hover:bg-accent-2/20"
                aria-label="Toggle theme">
                <svg class="sun-icon h-4 w-4" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd"
                          d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1z" />
                </svg>
                <svg class="moon-icon h-4 w-4" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z" />
                </svg>
            </button>

            <!-- Mobile Menu Toggle -->
            <button id="toggle-navigation-menu"
                class="flex h-7 w-7 items-center justify-center rounded-md border border-accent-2/20 bg-accent-2/10 p-1 transition-colors hover:bg-accent-2/20 sm:hidden"
                aria-expanded="false"
                aria-label="Toggle navigation">
                <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round"
                          stroke-linejoin="round"
                          stroke-width="2"
                          d="M4 6h16M4 12h16M4 18h16"/>
                </svg>
            </button>
        </div>
    </div>
</header>

<!-- Main Content -->
<main class="mx-auto max-w-3xl px-4 sm:px-8">

    <section id="about" class="mb-16">
        <div class="prose" id="about-content">
            <div class="loading-spinner">Loading about content…</div>
        </div>
    </section>

    <section id="publications" class="mb-16">
        <div class="prose" id="publications-content">
            <div class="loading-spinner">Loading publications…</div>
        </div>
    </section>

    <section id="resume" class="mb-16">
        <div class="prose" id="resume-content">
            <div class="loading-spinner">Loading résumé…</div>
        </div>
    </section>

</main>

<footer class="mx-auto max-w-3xl px-4 sm:px-8 py-8 text-center text-sm opacity-75">
    <p>© Germano Pansini — Robotics & Computer Vision</p>
</footer>

<script src="script.js"></script>
</body>
</html>
