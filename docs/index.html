<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Germano Pansini — Robotics & Computer Vision</title>
  <meta name="description" content="Robotics and Computer Vision Engineer focused on perception, embedded AI, and simulation-driven development.">

  <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <script>
    (function () {
      const theme = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>

<body class="bg-global-bg text-global-text antialiased">

<header id="main-header" class="group">
  <div class="header-grid">

    <a href="#" class="header-logo flex items-center">
      <!-- SVG LOGO IDENTICO -->
    </a>

    <div class="header-title">
      <span class="text-xl font-bold sm:text-2xl">Germano Pansini</span>
    </div>

    <nav class="mobile-nav-menu header-nav sm:flex sm:flex-row sm:items-center" id="navigation-menu">
      <a href="#about">About</a>
      <a href="#publications">Publications</a>
      <a href="#resume">Résumé</a>
    </nav>

    <div class="header-controls flex items-center gap-3">
      <button
        id="theme-toggle"
        class="flex h-7 w-7 items-center justify-center rounded-md border border-accent-2/20 bg-accent-2/10 p-1"
        aria-label="Toggle theme">

        <svg class="sun-icon h-4 w-4" fill="currentColor" viewBox="0 0 20 20">
          <path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1z"/>
        </svg>

        <svg class="moon-icon h-4 w-4" fill="currentColor" viewBox="0 0 20 20">
          <path d="M17.293 13.293A8 8 0 016.707 2.707a8 8 0 1010.586 10.586z"/>
        </svg>

      </button>

      <button id="toggle-navigation-menu"
        class="flex h-7 w-7 items-center justify-center rounded-md border border-accent-2/20 bg-accent-2/10 p-1 sm:hidden"
        aria-expanded="false">
        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
    </div>

  </div>
</header>

<main class="mx-auto max-w-3xl px-4 sm:px-8">
  <section id="about" class="mb-16">
    <div class="prose" id="about-content"></div>
  </section>

  <section id="publications" class="mb-16">
    <div class="prose" id="publications-content"></div>
  </section>

  <section id="resume" class="mb-16">
    <div class="prose" id="resume-content"></div>
  </section>
</main>

<footer class="mx-auto max-w-3xl px-4 sm:px-8 py-8 text-center text-sm opacity-75">
  © Germano Pansini — Robotics & Computer Vision
</footer>

<script src="script.js"></script>
</body>
</html>
